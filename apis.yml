aid: testgorilla
name: TestGorilla
description: >-
  TestGorilla is an AI-powered talent-assessment and skills-based hiring platform
  that helps organizations screen and evaluate candidates objectively. It offers a
  library of 350+ pre-employment tests (cognitive ability, personality, role-specific
  skills, coding, language, and situational judgement), AI interviews, and anti-cheating
  monitoring, and is used by companies such as PayPal, Equifax, and PepsiCo. TestGorilla
  advertises ATS integrations but does not publish a public self-serve developer API;
  this profile was surfaced as a portfolio company of Balderton Capital and Partech and
  enriched with the company's real public web, security, and trust surfaces.
